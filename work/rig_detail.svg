    <text x="262" y="358" font-size="12" font-weight="700" fill="#D8B4FE" text-anchor="middle">터프가 3레인으로 줄면서 RIG 아래쪽으로 3.3m 광폭 드랍존 확보</text>
    <text x="262" y="378" font-size="12" font-weight="800" fill="#86EFAC" text-anchor="middle">✔ 기둥(G4·G5) 옆은 '긴 풀업바' 구간이라 바벨을 뒤로 던져도 기둥에 절대 안 닿음!</text>

