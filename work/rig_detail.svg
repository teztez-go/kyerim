<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background:#0B0F17; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="72" fill="#0F172A" />
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#334155" stroke-width="2" />
  <text x="30" y="34" font-size="22" font-weight="900" fill="#F8FAFC">스쿼트 셀 구조 [짧은바 1.2m - 긴바 1.8m] &amp; 기둥(G4·G5) 바벨 드랍 안전거리 실측</text>
  <text x="30" y="57" font-size="13.5" font-weight="600" fill="#94A3B8">올림픽 바벨(길이 2.2m)은 1.2m 짧은 풀업바 양 기둥에 거치되며, 양옆으로 바벨 슬리브가 0.5m씩 돌출됩니다.</text>

  <!-- ==================== TOP BOX: 스쿼트 셀 나오는 방식 (짧은바 1.2m - 긴바 1.8m 교차 원리) ==================== -->
  <g transform="translate(25, 88)">
    <rect x="0" y="0" width="1150" height="235" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="2" />
    <rect x="0" y="0" width="1150" height="40" rx="14" fill="#082F49" />
    <text x="20" y="26" font-size="15.5" font-weight="900" fill="#7DD3FC">1. 스쿼트 셀 구성 원리: [짧은 풀업바 1.2m (스쿼트 셀)] — [긴 풀업바 1.8m (풀업·체조)] 교차 구조</text>

    <!-- Diagram of 3 Squat Cells + 2 Long Pull-up Bars -->
    <!-- Scale here: 1m = 90px -->
    <!-- Start x=130, y=95, depth 1.8m = 72px (y=95..167) -->
    <!-- Bay 1 (1.2m Squat = 108px): x=130..238 -->
    <!-- Bay 2 (1.8m Long = 162px): x=238..400 -->
    <!-- Bay 3 (1.2m Squat = 108px): x=400..508 -->
    <!-- Bay 4 (1.8m Long = 162px): x=508..670 -->
    <!-- Bay 5 (1.2m Squat = 108px): x=670..778 -->

    <!-- Squat Cell Highlights (1.2m Short Bars) -->
    <rect x="130" y="95" width="108" height="72" fill="#EC4899" fill-opacity="0.28" stroke="#F472B6" stroke-width="3" />
    <rect x="400" y="95" width="108" height="72" fill="#EC4899" fill-opacity="0.28" stroke="#F472B6" stroke-width="3" />
    <rect x="670" y="95" width="108" height="72" fill="#EC4899" fill-opacity="0.28" stroke="#F472B6" stroke-width="3" />

    <!-- Long Pull-up Bar Highlights (1.8m Long Bars) -->
    <rect x="238" y="95" width="162" height="72" fill="#0EA5E9" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 3" />
    <rect x="508" y="95" width="162" height="72" fill="#0EA5E9" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 3" />

    <!-- Uprights (Posts) -->
    <g fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5">
      <rect x="125" y="90" width="10" height="10" /><rect x="233" y="90" width="10" height="10" />
      <rect x="395" y="90" width="10" height="10" /><rect x="503" y="90" width="10" height="10" />
      <rect x="665" y="90" width="10" height="10" /><rect x="773" y="90" width="10" height="10" />

      <rect x="125" y="162" width="10" height="10" /><rect x="233" y="162" width="10" height="10" />
      <rect x="395" y="162" width="10" height="10" /><rect x="503" y="162" width="10" height="10" />
      <rect x="665" y="162" width="10" height="10" /><rect x="773" y="162" width="10" height="10" />
    </g>

    <!-- 2.2m Barbells Racked on the 1.2m Squat Cells (2.2m = 198px, overhanging 45px=0.5m on each side!) -->
    <!-- North Barbells (y=74) -->
    <g stroke="#FBBF24" stroke-width="4">
      <line x1="85" y1="74" x2="283" y2="74" />
      <line x1="355" y1="74" x2="553" y2="74" />
      <line x1="625" y1="74" x2="823" y2="74" />
    </g>
    <!-- Barbell Plates -->
    <g fill="#F59E0B">
      <rect x="98" y="66" width="8" height="16" rx="1" /><rect x="262" y="66" width="8" height="16" rx="1" />
      <rect x="368" y="66" width="8" height="16" rx="1" /><rect x="532" y="66" width="8" height="16" rx="1" />
      <rect x="638" y="66" width="8" height="16" rx="1" /><rect x="802" y="66" width="8" height="16" rx="1" />
    </g>

    <!-- South Barbells (y=188) -->
    <g stroke="#C084FC" stroke-width="4">
      <line x1="85" y1="188" x2="283" y2="188" />
      <line x1="355" y1="188" x2="553" y2="188" />
      <line x1="625" y1="188" x2="823" y2="188" />
    </g>
    <g fill="#A855F7">
      <rect x="98" y="180" width="8" height="16" rx="1" /><rect x="262" y="180" width="8" height="16" rx="1" />
      <rect x="368" y="180" width="8" height="16" rx="1" /><rect x="532" y="180" width="8" height="16" rx="1" />
      <rect x="638" y="180" width="8" height="16" rx="1" /><rect x="802" y="180" width="8" height="16" rx="1" />
    </g>

    <!-- Labels inside Bays -->
    <text x="184" y="128" font-size="13" font-weight="900" fill="#F472B6" text-anchor="middle">짧은 풀업바</text>
    <text x="184" y="146" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">(1.2m 스쿼트셀)</text>

    <text x="319" y="128" font-size="13" font-weight="900" fill="#38BDF8" text-anchor="middle">긴 풀업바</text>
    <text x="319" y="146" font-size="12" font-weight="800" fill="#BAE6FD" text-anchor="middle">(1.8m 체조·간격확보)</text>

    <text x="454" y="128" font-size="13" font-weight="900" fill="#F472B6" text-anchor="middle">짧은 풀업바</text>
    <text x="454" y="146" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">(1.2m 스쿼트셀)</text>

    <text x="589" y="128" font-size="13" font-weight="900" fill="#38BDF8" text-anchor="middle">긴 풀업바</text>
    <text x="589" y="146" font-size="12" font-weight="800" fill="#BAE6FD" text-anchor="middle">(1.8m 체조·간격확보)</text>

    <text x="724" y="128" font-size="13" font-weight="900" fill="#F472B6" text-anchor="middle">짧은 풀업바</text>
    <text x="724" y="146" font-size="12" font-weight="800" fill="#FFF" text-anchor="middle">(1.2m 스쿼트셀)</text>

    <!-- Barbell overhang callout -->
    <text x="184" y="58" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">◀─── 2.2m 올림픽 바벨 (양옆 0.5m씩 돌출) ───▶</text>
    <text x="319" y="218" font-size="12" font-weight="800" fill="#4ADE80" text-anchor="middle">▲ 바벨 끝단끼리 0.8m 여유 간격 확보</text>

    <!-- Right side summary text -->
    <rect x="855" y="55" width="275" height="160" rx="10" fill="#0F172A" stroke="#334155" />
    <text x="870" y="82" font-size="13.5" font-weight="900" fill="#F8FAFC">✔ 왜 교차로 배치할까요?</text>
    <text x="870" y="106" font-size="12" font-weight="600" fill="#CBD5E1">1. 짧은 바(1.2m): 바벨 J컵을 거는</text>
    <text x="882" y="124" font-size="12" font-weight="800" fill="#F472B6">스쿼트 셀 (위·아래 2명 동시 사용)</text>
    <text x="870" y="148" font-size="12" font-weight="600" fill="#CBD5E1">2. 긴 바(1.8m): 2.2m 바벨끼리 부딪히지</text>
    <text x="882" y="166" font-size="12" font-weight="600" fill="#CBD5E1">않게 0.8m 간격을 띄워주면서</text>
    <text x="882" y="184" font-size="12" font-weight="800" fill="#38BDF8">넓은 풀업/머슬업/토투바 철봉 역할</text>
    <text x="870" y="205" font-size="12" font-weight="800" fill="#A3E635">3. 가장자리는 무조건 1.2m 스쿼트셀!</text>
  </g>

  <!-- ==================== BOTTOM LEFT: 기둥 아래(남측)로 내렸을 때의 실제 간격 문제 ==================== -->
  <g transform="translate(25, 345)">
    <rect x="0" y="0" width="560" height="590" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <rect x="0" y="0" width="560" height="52" rx="14" fill="#451A03" />
    <text x="18" y="24" font-size="15.5" font-weight="900" fill="#FCD34D">[검토 1] 사각 RIG를 기둥(G4·G5) '남측(아래)'이나 '북측(위)'으로 띄울 때</text>
    <text x="18" y="43" font-size="12" font-weight="700" fill="#FDE68A">실제 축척(1m = 30px)으로 확인한 기둥~RIG 간격 및 바벨 드랍 반경</text>

    <!-- Sub-panel A: Moving South of G4/G5 -->
    <rect x="20" y="68" width="520" height="235" rx="10" fill="url(#grid)" stroke="#475569" />
    <text x="32" y="90" font-size="13.5" font-weight="900" fill="#FCA5A5">① 기둥 남측(아래쪽)으로 RIG를 내릴 경우 → 간격 부족 (1.2m 불과)</text>

    <!-- G4/G5 row at y=115..139 (0.8m = 24px) -->
    <line x1="20" y1="127" x2="540" y2="127" stroke="#64748B" stroke-dasharray="4 4" />
    <rect x="130" y="115" width="24" height="24" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5" />
    <text x="142" y="131" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">G4</text>
    <rect x="340" y="115" width="24" height="24" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5" />
    <text x="352" y="131" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">G5</text>

    <!-- Distance from G4 south face (y=139) to Turf (y=268) is 4.3m = 129px -->
    <!-- RIG (1.8m = 54px) placed at y=175..229 -->
    <rect x="110" y="175" width="360" height="54" fill="#EC4899" fill-opacity="0.22" stroke="#F472B6" stroke-width="2.5" />
    <text x="290" y="206" font-size="13" font-weight="900" fill="#FFF" text-anchor="middle">사각 RIG (폭 1.8m)</text>

    <!-- Gap arrows -->
    <line x1="142" y1="139" x2="142" y2="175" stroke="#EF4444" stroke-width="2.5" />
    <circle cx="142" cy="157" r="14" fill="#7F1D1D" stroke="#EF4444" stroke-width="1.5" />
    <text x="142" y="161" font-size="10" font-weight="900" fill="#FCA5A5" text-anchor="middle">1.2m</text>
    <text x="235" y="161" font-size="11.5" font-weight="900" fill="#FCA5A5">❌ 스쿼트 후 뒤로 바벨 드랍 시 기둥(G4·G5)에 충돌! (최소 2.0m 필요)</text>

    <line x1="142" y1="229" x2="142" y2="268" stroke="#F59E0B" stroke-width="2.5" />
    <text x="245" y="253" font-size="11.5" font-weight="900" fill="#FCD34D">⚠ 남측도 터프까지 1.3m밖에 안 남아 스쿼트 공간 협소</text>

    <!-- Turf at y=268..303 -->
    <rect x="20" y="268" width="520" height="35" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" />
    <text x="280" y="290" font-size="12" font-weight="900" fill="#A7F3D0" text-anchor="middle">3레인 슬레드 터프 (기둥에서 터프까지 총 거리가 4.3m로 고정되어 있음)</text>

    <!-- Sub-panel B: Moving North of G4/G5 -->
    <rect x="20" y="318" width="520" height="252" rx="10" fill="url(#grid)" stroke="#475569" />
    <text x="32" y="340" font-size="13.5" font-weight="900" fill="#7DD3FC">② 반대로 기둥 '북측(위쪽)'으로 2.2m 띄울 경우 → 드랍은 안전하나 메트콘 축소</text>

    <!-- RIG placed 2.2m (66px) North of G4/G5: RIG at y=360..414, G4/G5 at y=480..504 -->
    <rect x="110" y="360" width="360" height="54" fill="#EC4899" fill-opacity="0.22" stroke="#F472B6" stroke-width="2.5" />
    <text x="290" y="391" font-size="13" font-weight="900" fill="#FFF" text-anchor="middle">사각 RIG (폭 1.8m · 기둥 북측 2.2m 위에 배치)</text>

    <line x1="142" y1="414" x2="142" y2="480" stroke="#4ADE80" stroke-width="2.5" stroke-dasharray="4 2" />
    <text x="260" y="452" font-size="12" font-weight="900" fill="#86EFAC">✔ 기둥까지 2.2m 확보 (스쿼트 바벨 드랍 안전)</text>

    <line x1="20" y1="492" x2="540" y2="492" stroke="#64748B" stroke-dasharray="4 4" />
    <rect x="130" y="480" width="24" height="24" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5" />
    <text x="142" y="496" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">G4</text>
    <rect x="340" y="480" width="24" height="24" fill="#1E293B" stroke="#94A3B8" stroke-width="2.5" />
    <text x="352" y="496" font-size="10" font-weight="900" fill="#FFF" text-anchor="middle">G5</text>

    <rect x="20" y="535" width="520" height="35" fill="#064E3B" fill-opacity="0.5" stroke="#10B981" />
    <text x="280" y="557" font-size="12" font-weight="900" fill="#A7F3D0" text-anchor="middle">3레인 슬레드 터프 (단점: RIG가 위로 올라간 만큼 메트콘 아레나가 좁아짐)</text>
  </g>

  <!-- ==================== BOTTOM RIGHT: 가장 완벽한 해법 (기둥 양옆을 긴 풀업바로 띄우는 정밀 설계) ==================== -->
  <g transform="translate(615, 345)">
    <rect x="0" y="0" width="560" height="590" rx="14" fill="#111827" stroke="#22C55E" stroke-width="3" />
    <rect x="0" y="0" width="560" height="52" rx="14" fill="#052E16" />
    <text x="18" y="24" font-size="15.5" font-weight="900" fill="#86EFAC">[최적 설계 ⭐] 기둥(G4·G5) 양옆에는 '긴 풀업바'를 두고, 빈 구간에만 '스쿼트셀' 배치!</text>
    <text x="18" y="43" font-size="12" font-weight="700" fill="#A7F3D0">기둥과 바벨이 가로(좌우)로 1m 이상 떨어져 있어, 뒤로 드랍해도 기둥에 절대 닿지 않음!</text>

    <!-- Zoomed Plan View of the Exact Rig Layout -->
    <rect x="18" y="68" width="524" height="395" rx="10" fill="url(#grid)" stroke="#334155" />

    <!-- East Wall on Right (x=515) -->
    <line x1="515" y1="68" x2="515" y2="463" stroke="#F8FAFC" stroke-width="6" />
    <rect x="507" y="295" width="6" height="45" fill="#D946EF" rx="2" />
    <text x="502" y="288" font-size="10.5" font-weight="900" fill="#F472B6" text-anchor="end">◀ 하이록스 칠판(G6)</text>

    <!-- North Drop Zone Callout -->
    <rect x="35" y="82" width="465" height="90" rx="8" fill="#0EA5E9" fill-opacity="0.08" stroke="#38BDF8" stroke-dasharray="5 4" />
    <text x="267" y="115" font-size="14" font-weight="900" fill="#7DD3FC" text-anchor="middle">▲ 북측(메트콘) 스쿼트 &amp; 바벨 드랍 안전 구역 (위로 7.3m 완전 개방!)</text>
    <text x="267" y="138" font-size="12" font-weight="700" fill="#BAE6FD" text-anchor="middle">스쿼트 셀(짧은 바 1.2m) 뒤편에 기둥이 전혀 없어 마음껏 뒤로 바벨 드랍 가능</text>

    <!-- G-Row Line (y=235) -->
    <line x1="18" y1="235" x2="515" y2="235" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5 5" />

    <!-- Scale along X:
         G4 column at x=95 (width 20px = 0.8m -> 85..105)
         G5 column at x=297 (width 20px = 0.8m -> 287..307)
         G6 column at x=515 (East Wall)
         Between G4(105) and G5(287) = 182px (7.3m):
           - [긴 풀업바 1.55m (39px): x=105..144]
           - [짧은바 스쿼트셀 1.2m (30px): x=144..174]
           - [긴 풀업바 1.8m (45px): x=174..219]
           - [짧은바 스쿼트셀 1.2m (30px): x=219..249]
           - [긴 풀업바 1.55m (38px): x=249..287]
         Between G5(307) and East Wall(515) = 208px (8.1m):
           - [긴 풀업바 1.55m (39px): x=307..346]
           - [짧은바 스쿼트셀 1.2m (30px): x=346..376]
           - [긴 풀업바 1.8m (45px): x=376..421]
           - [짧은바 스쿼트셀 1.2m (30px): x=421..451]
           - [동측 벽면 2.5m 이격 통로 (64px): x=451..515]
         Left of G4(85):
           - [짧은바 스쿼트셀 1.2m (30px): x=25..55]
           - [긴 풀업바 1.2m (30px): x=55..85]
    -->

    <!-- Long Pull-up Bar Sections (Blue) -->
    <g fill="#0EA5E9" fill-opacity="0.14" stroke="#38BDF8" stroke-width="2">
      <rect x="55" y="213" width="30" height="45" />
      <rect x="105" y="213" width="39" height="45" />
      <rect x="174" y="213" width="45" height="45" />
      <rect x="249" y="213" width="38" height="45" />
      <rect x="307" y="213" width="39" height="45" />
      <rect x="376" y="213" width="45" height="45" />
    </g>

    <!-- Short Pull-up Bar = Squat Cell Sections (Pink, 1.2m each) -->
    <g fill="#EC4899" fill-opacity="0.35" stroke="#F472B6" stroke-width="3">
      <rect x="25" y="213" width="30" height="45" />
      <rect x="144" y="213" width="30" height="45" />
      <rect x="219" y="213" width="30" height="45" />
      <rect x="346" y="213" width="30" height="45" />
      <rect x="421" y="213" width="30" height="45" />
    </g>

    <!-- Squat Cell Labels -->
    <g font-size="9.5" font-weight="900" fill="#FFF" text-anchor="middle">
      <text x="40" y="239">1.2m셀</text>
      <text x="159" y="239">1.2m셀</text>
      <text x="234" y="239">1.2m셀</text>
      <text x="361" y="239">1.2m셀</text>
      <text x="436" y="239">1.2m셀</text>
    </g>
    <g font-size="8.5" font-weight="800" fill="#7DD3FC" text-anchor="middle">
      <text x="124" y="239">긴바</text>
      <text x="196" y="239">긴바1.8m</text>
      <text x="268" y="239">긴바</text>
      <text x="326" y="239">긴바</text>
      <text x="398" y="239">긴바1.8m</text>
    </g>

    <!-- 2.2m Barbells on North (y=198) & South (y=273) of each 1.2m Squat Cell (2.2m = 55px) -->
    <g stroke="#FBBF24" stroke-width="3.5">
      <line x1="12.5" y1="198" x2="67.5" y2="198" />
      <line x1="131.5" y1="198" x2="186.5" y2="198" />
      <line x1="206.5" y1="198" x2="261.5" y2="198" />
      <line x1="333.5" y1="198" x2="388.5" y2="198" />
      <line x1="408.5" y1="198" x2="463.5" y2="198" />
    </g>
    <g stroke="#C084FC" stroke-width="3.5">
      <line x1="12.5" y1="273" x2="67.5" y2="273" />
      <line x1="131.5" y1="273" x2="186.5" y2="273" />
      <line x1="206.5" y1="273" x2="261.5" y2="273" />
      <line x1="333.5" y1="273" x2="388.5" y2="273" />
