    <!-- Bottom Takeaways -->
    <text x="20" y="492" font-size="13" font-weight="800" fill="#86EFAC">1. 가장자리(양끝) 모두 '1.2m 짧은 풀업바(스쿼트 셀)'로 시작하며 동측 벽에서 2.5m 이격!</text>
    <text x="20" y="516" font-size="13" font-weight="800" fill="#86EFAC">2. 기둥 G4·G5 바로 옆에는 '긴 풀업바(1.55m)'를 배치 → 바벨 끝단도 기둥에서 1m 이상 이격!</text>
    <text x="20" y="540" font-size="13" font-weight="800" fill="#86EFAC">3. 스쿼트 후 바벨을 뒤로 드랍할 때 북측 7.3m / 남측 3.3m 완전히 비어 있어 100% 안전!</text>
    <text x="20" y="564" font-size="13" font-weight="800" fill="#FDE68A">4. (선택) 기둥 G4·G5 연결바 없이 아예 끊으면 [해법 2: 트윈 사각 RIG]가 됩니다.</text>
